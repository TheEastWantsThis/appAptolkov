name: watchroom

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: watchroom
      POSTGRES_PASSWORD: watchroom
      POSTGRES_USER: watchroom
    ports:
      - "5432:5432"
    volumes:
      - watchroom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchroom -d watchroom"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://watchroom:watchroom@postgres:5432/watchroom
      LOG_LEVEL: info
      NODE_ENV: development
      MOCK_TELEGRAM_AUTH: "true"
      MOCK_TELEGRAM_ID: 900000001
      MOCK_TELEGRAM_FIRST_NAME: Локальный автор
      SHUTDOWN_TIMEOUT_MS: 10000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://watchroom:watchroom@postgres:5432/watchroom
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  watchroom-postgres:
