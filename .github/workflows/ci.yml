name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: watchroom_test
          POSTGRES_USER: watchroom
          POSTGRES_PASSWORD: watchroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchroom -d watchroom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Empty database migrations
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://watchroom:watchroom@127.0.0.1:5432/watchroom_test

      - name: PostgreSQL + Socket.IO release gate
        run: pnpm test:postgres
        env:
          TEST_DATABASE_URL: postgresql://watchroom:watchroom@127.0.0.1:5432/watchroom_test

      - name: Build
        run: pnpm build
