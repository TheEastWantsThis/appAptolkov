# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: off

databases:
  - name: watchroom-db
    region: frankfurt
    # Temporary closed-test profile. Upgrade before the database expires.
    plan: free
    postgresMajorVersion: "17"
    databaseName: watchroom
    user: watchroom
    ipAllowList: []

services:
  - type: web
    name: watchroom-api
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health/ready
    # preDeployCommand is not available on Render Free. With one API instance,
    # migrate deploy is safe and idempotent as part of the startup command.
    dockerCommand: node node_modules/prisma/build/index.js migrate deploy && node apps/api/dist/index.js
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - prisma/**
        - prisma.config.ts
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: MOCK_TELEGRAM_AUTH
        value: "false"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "25000"
      - key: DATABASE_URL
        fromDatabase:
          name: watchroom-db
          property: connectionString
      - key: PUBLIC_APP_URL
        value: https://watchroom-miniapp.vercel.app
      - key: WEB_ORIGIN
        value: https://watchroom-miniapp.vercel.app
      - key: API_URL
        value: https://watchroom-api.onrender.com
      - key: WS_URL
        value: wss://watchroom-api.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: METRICS_BEARER_TOKEN
        generateValue: true
      - key: OPERATIONS_BEARER_TOKEN
        generateValue: true
